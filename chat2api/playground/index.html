<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>chat2api playground</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #222; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  select, input, textarea, button { font-size: 14px; padding: 6px 10px; border-radius: 6px; border: 1px solid #bbb; }
  button { cursor: pointer; background: #2563eb; color: #fff; border: none; }
  button.secondary { background: #666; }
  #chat { border: 1px solid #ddd; border-radius: 8px; height: 380px; overflow-y: auto; padding: 12px; margin: 12px 0; background: #fafafa; }
  .msg { margin: 6px 0; white-space: pre-wrap; }
  .msg.user { font-weight: 600; }
  .msg.err { color: #b00; }
  #row { display: flex; gap: 8px; }
  #prompt { flex: 1; resize: vertical; min-height: 44px; }
  details { margin-top: 20px; }
  pre#joblog { background: #111; color: #9f9; padding: 10px; max-height: 220px; overflow-y: auto; font-size: 12px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  td, th { border: 1px solid #ddd; padding: 4px 8px; text-align: left; }
</style>
</head>
<body>
<header>
  <strong>chat2api</strong>
  <select id="model"></select>
  <input id="key" placeholder="API key (nếu bật)" size="18">
  <span id="latency"></span>
</header>

<div id="chat"></div>
<div id="row">
  <textarea id="prompt" placeholder="Nhập tin nhắn..."></textarea>
  <button id="send">Send</button>
  <button id="clear" class="secondary">Clear</button>
</div>

<details>
  <summary>Admin — tích hợp web chat mới</summary>
  <p><input id="siteurl" placeholder="https://chat.example.com" size="40">
     <button id="integrate">Integrate</button> <span id="jobstatus"></span>
     <span id="loginactions" hidden>
       <button id="logincomplete">Đã đăng nhập</button>
       <button id="canceljob" class="secondary">Hủy</button>
     </span></p>
  <pre id="joblog"></pre>
  <table id="recipies"><thead><tr><th>slug</th><th>models</th><th></th></tr></thead><tbody></tbody></table>
</details>

<script>
const $ = (s) => document.querySelector(s);
const chat = $("#chat");
let key = localStorage.getItem("c2a_key") || "";
$("#key").value = key;
$("#key").onchange = () => { key = $("#key").value; localStorage.setItem("c2a_key", key); };

function headers() {
  const h = {"Content-Type": "application/json"};
  if (key) h["Authorization"] = "Bearer " + key;
  return h;
}

async function loadModels() {
  try {
    const r = await fetch("/v1/models", {headers: headers()});
    const data = await r.json();
    const sel = $("#model");
    sel.textContent = "";
    for (const m of data.data.filter(m => m.ready !== false)) {
      const opt = document.createElement("option");
      opt.value = m.id;
      opt.textContent = m.id;
      sel.appendChild(opt);
    }
  } catch (e) { addMsg("err", "Không nạp được models: " + e); }
}

function addMsg(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

async function send() {
  const prompt = $("#prompt").value.trim();
  if (!prompt) return;
  $("#prompt").value = "";
  addMsg("user", prompt);
  const reply = addMsg("", "");
  const t0 = performance.now();
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST", headers: headers(),
      body: JSON.stringify({model: $("#model").value, stream: true,
        messages: [{role: "user", content: prompt}]})});
    if (!r.ok) { reply.className = "msg err"; reply.textContent = (await r.json()).error?.message || r.statusText; return; }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
        if (!line.startsWith("data: ")) continue;
        const payload = line.slice(6);
        if (payload === "[DONE]") continue;
        const delta = JSON.parse(payload).choices[0].delta.content || "";
        reply.textContent += delta;
        chat.scrollTop = chat.scrollHeight;
      }
    }
  } catch (e) { reply.className = "msg err"; reply.textContent = String(e); }
  $("#latency").textContent = Math.round(performance.now() - t0) + " ms";
}
$("#send").onclick = send;
$("#prompt").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("#clear").onclick = () => { chat.innerHTML = ""; $("#latency").textContent = ""; };

async function loadRecipes() {
  try {
    const r = await fetch("/admin/recipes", {headers: headers()});
    if (!r.ok) return;
    const list = await r.json();
    const tb = $("#recipies tbody");
    tb.innerHTML = "";
    for (const rec of list) {
      const tr = document.createElement("tr");
      const tdSlug = document.createElement("td");
      tdSlug.textContent = rec.slug;
      const tdModels = document.createElement("td");
      tdModels.textContent = (rec.models || []).join(", ");
      const tdBtns = document.createElement("td");
      const btnReload = document.createElement("button");
      btnReload.className = "secondary";
      btnReload.textContent = "Reload";
      btnReload.onclick = () => {
        fetch("/admin/recipes/" + rec.slug + "/reload", {method: "POST", headers: headers()}).then(loadRecipes);
      };
      const btnDel = document.createElement("button");
      btnDel.className = "secondary";
      btnDel.textContent = "Delete";
      btnDel.addEventListener("click", () => delRecipe(rec.slug));
      tdBtns.appendChild(btnReload);
      tdBtns.appendChild(btnDel);
      tr.appendChild(tdSlug);
      tr.appendChild(tdModels);
      tr.appendChild(tdBtns);
      tb.appendChild(tr);
    }
  } catch (e) {}
}

async function delRecipe(slug) {
  if (!confirm("Xóa recipe " + slug + "?")) return;
  await fetch("/admin/recipes/" + slug, {method: "DELETE", headers: headers()});
  loadRecipes();
}

let activeJobId = null;
let pollGeneration = 0;
let pollTimer = null;
let pollAbort = null;
let operationGeneration = 0;
let actionGeneration = 0;
let actionInFlightFor = null;
const terminalStatuses = ["ok", "failed", "cancelled", "login_timeout"];

function resetLoginButtons() {
  [$("#logincomplete"), $("#canceljob")].forEach(button => { button.disabled = false; });
}

function stopPolling() {
  pollGeneration++;
  if (pollTimer !== null) clearTimeout(pollTimer);
  if (pollAbort !== null) pollAbort.abort();
  pollTimer = null;
  pollAbort = null;
  activeJobId = null;
}

function showJobStatus(j) {
  const actions = $("#loginactions");
  const canLogin = j.status === "waiting_login" && j.can_complete_login === true;
  actions.hidden = !canLogin;
  if (canLogin) {
    if (actionInFlightFor !== pollGeneration) resetLoginButtons();
    $("#jobstatus").textContent = "Chrome đã mở — hãy đăng nhập trong cửa sổ đó";
  } else if (j.status === "waiting_login") {
    $("#jobstatus").textContent = "Đang đóng phiên đăng nhập hết hạn…";
  } else if (j.status === "resuming") {
    $("#jobstatus").textContent = "Đang lưu session và tiếp tục…";
  } else {
    $("#jobstatus").textContent = "trạng thái: " + j.status;
  }
}

function startPolling(jobId) {
  stopPolling();
  const generation = pollGeneration;
  activeJobId = jobId;
  let ticks = 0;

  const poll = async () => {
    if (generation !== pollGeneration || jobId !== activeJobId) return;
    if (++ticks > 660) {
      $("#loginactions").hidden = true;
      $("#jobstatus").textContent = "timeout: job quá lâu, kiểm tra lại sau";
      stopPolling();
      return;
    }

    const controller = new AbortController();
    pollAbort = controller;
    let terminal = false;
    try {
      if (generation !== pollGeneration || jobId !== activeJobId) return;
      const r = await fetch("/admin/integrate/" + jobId,
        {headers: headers(), signal: controller.signal});
      if (generation !== pollGeneration || jobId !== activeJobId) return;
      const j = await r.json();
      if (generation !== pollGeneration || jobId !== activeJobId) return;
      if (!r.ok) throw new Error(j.error?.message || r.statusText);
      $("#joblog").textContent = j.log.join("\n");
      $("#joblog").scrollTop = $("#joblog").scrollHeight;
      showJobStatus(j);
      terminal = terminalStatuses.includes(j.status);
      if (terminal) {
        stopPolling();
        loadModels();
        loadRecipes();
      }
    } catch (e) {
      if (generation === pollGeneration && jobId === activeJobId && e.name !== "AbortError") {
        $("#jobstatus").textContent = "poll lỗi: " + e;
      }
    } finally {
      if (pollAbort === controller) pollAbort = null;
      if (!terminal && generation === pollGeneration && jobId === activeJobId) {
        pollTimer = setTimeout(poll, 1000);
      }
    }
  };

  pollTimer = setTimeout(poll, 1000);
}

async function postJobAction(action) {
  if (!activeJobId) return;
  const jobId = activeJobId;
  const generation = pollGeneration;
  const actionToken = ++actionGeneration;
  actionInFlightFor = generation;
  const buttons = [$("#logincomplete"), $("#canceljob")];
  buttons.forEach(button => { button.disabled = true; });
  try {
    const r = await fetch("/admin/integrate/" + jobId + "/" + action,
      {method: "POST", headers: headers()});
    if (generation !== pollGeneration || jobId !== activeJobId || actionToken !== actionGeneration) return;
    const data = await r.json();
    if (generation !== pollGeneration || jobId !== activeJobId || actionToken !== actionGeneration) return;
    if (!r.ok) throw new Error(data.error?.message || r.statusText);
    if (action === "login-complete") {
      startPolling(jobId);
      actionInFlightFor = null;
      showJobStatus({status: "resuming"});
    } else {
      showJobStatus(data);
      if (terminalStatuses.includes(data.status)) {
        stopPolling();
        loadModels();
        loadRecipes();
      }
    }
  } catch (e) {
    if (generation === pollGeneration && jobId === activeJobId && actionToken === actionGeneration) {
      $("#jobstatus").textContent = "lỗi: " + e;
      resetLoginButtons();
    }
  } finally {
    if (generation === pollGeneration && jobId === activeJobId && actionToken === actionGeneration) {
      actionInFlightFor = null;
    }
  }
}

$("#logincomplete").onclick = () => postJobAction("login-complete");
$("#canceljob").onclick = () => postJobAction("cancel");

$("#integrate").onclick = async () => {
  const operation = ++operationGeneration;
  actionGeneration++;
  actionInFlightFor = null;
  resetLoginButtons();
  $("#integrate").disabled = true;
  stopPolling();
  $("#loginactions").hidden = true;
  $("#joblog").textContent = "";
  try {
    const r = await fetch("/admin/integrate", {method: "POST", headers: headers(),
      body: JSON.stringify({url: $("#siteurl").value})});
    if (operation !== operationGeneration) return;
    const data = await r.json();
    if (operation !== operationGeneration) return;
    if (!r.ok) { $("#jobstatus").textContent = data.error?.message || r.statusText; return; }
    $("#jobstatus").textContent = "đang chạy job " + data.job_id + "...";
    resetLoginButtons();
    startPolling(data.job_id);
  } catch (e) {
    if (operation === operationGeneration) $("#jobstatus").textContent = "lỗi: " + e;
  } finally {
    if (operation === operationGeneration) $("#integrate").disabled = false;
  }
};

loadModels();
loadRecipes();
</script>
</body>
</html>
