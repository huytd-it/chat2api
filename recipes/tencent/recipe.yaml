slug: tencent
url: https://aistudio.tencent.ai/
prompt:
  input_selector: textarea[placeholder="Ask me anything"]
  input_mode: fill
  submit: click:div.hy-chat-input-send-btn
response:
  last_message_selector: div.agent-chat__bubble--ai
  done_signal:
    type: copy_button
    selector: div.agent-chat__toolbar__copy
    scope: after
    use_copy_result: true
models:
- id: default
login:
  strategy: round_robin
  quota: 50
keep_context: true
