url: https://gemini.google.com/app
prompt:
  input_selector: rich-textarea .ql-editor[contenteditable="true"]
  input_mode: fill
  submit: Enter
response:
  last_message_selector: model-response .model-response-text
  done_signal:
    type: copy_button
    quiet_ms: 600
    fallback_quiet_ms: 3000
    timeout_ms: 300000
    scope: after
    use_copy_result: true
  format: markdown
new_chat:
  url: https://gemini.google.com/app
timing:
  ready_delay_ms: 2000
  input_delay_ms: 600
models:
- id: gemini-web
slug: gemini-web
login:
  anon_trial_limit: 20
  strategy: round_robin
  quota: 50
keep_context: true
