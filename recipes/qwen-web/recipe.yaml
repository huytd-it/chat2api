slug: qwen-web
url: https://chat.qwen.ai/
prompt:
  # Composer hiện tại là textarea.message-input-textarea (placeholder đã đổi
  # thành "How can I help you today?", không còn "Ask Qwen").
  input_selector: textarea.message-input-textarea
  input_mode: fill
  submit: Enter
response:
  last_message_selector: .qwen-markdown
  # Chế độ so sánh: Qwen sinh 2 câu trả lời song song (.smrm-card) và chỉ hiện
  # nút Copy sau khi chọn "I prefer this response" — runner tự chọn card đầu.
  choice_selector: button.smrm-card__prefer-btn
  format: markdown
  capture_html: true
  # Msg cảnh báo limit của site KHÔNG phải câu trả lời: dính pattern thì khóa
  # tạm account này 24h rồi chuyển account khác cùng recipe (mỗi account 1 lần).
  # Hết account → 429, không trả msg cảnh báo cho client.
  limit_patterns:
    - "reached today's.+limit"
    - "Upgrade your membership or switch to another model"
  limit_cooldown_hours: 24
  # Bắt buộc nút Copy của reply cuối hiện ra; không chốt khi Stop biến mất
  # hoặc text tạm đứng yên trong lúc stream. Runner hover reply để lộ nút.
  done_signal:
    type: copy_button
    scope: after
    use_copy_result: true
    fallback_quiet_ms: 0
    quiet_ms: 1000
    timeout_ms: 300000
flows:
  select_model:
    selector: '[aria-label="Select Model"]'
    action: 'click:[aria-label="Select Model"]'
    # alternative neo bền hơn: '#qwen-chat-header-left [aria-label="Select Model"]' hoặc 'div.wms-trigger'
  image:
    type: image
    action: 'click:[aria-label="Select Mode"];click:[role="menuitem"]:has-text("Create Image")'
    response:
      # Ảnh kết quả là img.qwen-image; gallery gợi ý dùng class khác nên không lẫn.
      media_selector: img.qwen-image
      done_signal:
        type: selector_appear
        selector: img.qwen-image
        timeout_ms: 300000
new_chat:
  selector: div[role='button'][aria-label='New Chat']
timing:
  ready_delay_ms: 2000
  input_delay_ms: 600
models:
  - id: qwen3.7-plus
    action: 'click:div[role="listbox"][aria-label="Models"] div[role="option"]:has-text("Qwen3.7-Plus")'
    capability: chat
  - id: qwen3.8-max
    action: 'click:div[role="listbox"][aria-label="Models"] div[role="option"]:has-text("Qwen3.8-Max")'
    capability: chat
  # Chế độ Create Image tự chọn Qwen-Image; không mở dropdown chat ở đó.
  - id: image
    capability: image
  # giữ alias cũ nếu client đang dùng qwen-web/qwen-web
  - id: qwen-web
    capability: chat
    variants: false
# Danh sách model lấy qua API (GET /api/models) thay vì mở dropdown và đọc DOM.
# ID = slug của tên hiển thị (Qwen4-Max-Preview → qwen4-max-preview), khớp
# catalog cũ. 5/8 model nằm sau "Expand more models" → click? mở nếu đang gọn.
model_list:
  url: /api/models
  headers:
    Authorization: Bearer {{ls:token}}
  items: data
  id: name
  label: name
  value: id
  filter:
    path: info.is_active
    equals: true
  meta:
    thinking: info.meta.capabilities.thinking
    auto: info.meta.auto_thinking
  action: 'click?:.wms-more-entry__text:text-is("Expand more models");click:[role="listbox"][aria-label="Models"] [role="option"]:has(.wms-list__name-text:text-is("{{label}}"))'
# Chế độ suy nghĩ ghép với model: qwen3.8-max-thinking, qwen3.8-max-fast,
# qwen3.7-plus-auto… Áp cả cho model lấy từ model_list (qwen4-max-preview…).
# `when` đọc meta từ API: capabilities.thinking=false → không có Thinking/Fast
# (Qwen3.5-Omni-Plus); auto_thinking rỗng → không có Auto (Qwen3.7-Max,
# Qwen3.8-Omni-Flash) — khớp DOM kiểm chứng 2026-11-11. Glob `models` là chốt
# dự phòng khi model chưa có meta (catalog cũ quét bằng DOM).
variants:
  thinking:
    label: Thinking
    action: 'click:.qwen-thinking-selector;click:.qwen-chat-v2-dropdown-menu-item:has(.qwen-chat-v2-dropdown-menu-item-label:text-is("Thinking"))'
    models: ['qwen*', '!qwen3.5-omni-plus']
    when: {thinking: true}
  fast:
    label: Fast
    action: 'click:.qwen-thinking-selector;click:.qwen-chat-v2-dropdown-menu-item:has(.qwen-chat-v2-dropdown-menu-item-label:text-is("Fast"))'
    models: ['qwen*', '!qwen3.5-omni-plus']
    when: {thinking: true}
  auto:
    label: Auto
    action: 'click:.qwen-thinking-selector;click:.qwen-chat-v2-dropdown-menu-item:has(.qwen-chat-v2-dropdown-menu-item-label:text-is("Auto"))'
    models: ['qwen*', '!qwen3.5-omni-plus', '!qwen3.7-max', '!qwen3.8-omni-flash']
    when: {auto: true}
login:
  anon_trial_limit: 20
  strategy: round_robin
  quota: 50
keep_context: true
# Chat text: vẫn gõ prompt qua giao diện (POST tạo chat/gửi tin bị Aliyun WAF
# chặn nếu fetch thô), nhưng câu trả lời đọc qua API lịch sử chat thay cho
# DOM/nút Copy — nhận markdown gốc, không phụ thuộc clipboard. Flow ảnh vẫn
# dùng khối `response` của flow image ở trên.
api:
  url_vars:
    chat_id: '/c/([0-9a-fA-F-]{36})'
  poll:
    url: /api/v2/chats/{{chat_id}}?direction=up&limit=10
    headers:
      Authorization: Bearer {{ls:token}}
    interval_ms: 1500
    # id tin cuối phải khác lúc trước khi gửi: nối tiếp hội thoại thì tin cuối
    # cũ đã done=true, không được nhận nhầm.
    fresh: data.chat.messages.-1.id
    done:
      path: data.chat.messages.-1.done
      equals: true
  # Thinking: content_list có phase think trước answer — lấy đúng phase answer.
  result: data.chat.messages.-1.content_list.[phase=answer].content
  error: data.chat.messages.-1.error
