slug: qwen-web
url: https://chat.qwen.ai/
prompt:
  # Composer hiện tại là textarea.message-input-textarea (placeholder đã đổi
  # thành "How can I help you today?", không còn "Ask Qwen").
  input_selector: textarea.message-input-textarea
  input_mode: fill
  submit: Enter
response:
  last_message_selector: .qwen-markdown
  format: markdown
  capture_html: true
  # Msg cảnh báo limit của site KHÔNG phải câu trả lời: dính pattern thì khóa
  # tạm account này 24h rồi chuyển account khác cùng recipe (mỗi account 1 lần).
  # Hết account → 429, không trả msg cảnh báo cho client.
  limit_patterns:
    - "reached today's.+limit"
    - "Upgrade your membership or switch to another model"
  limit_cooldown_hours: 24
  # Bắt buộc nút Copy của reply cuối hiện ra; không chốt khi Stop biến mất
  # hoặc text tạm đứng yên trong lúc stream. Runner hover reply để lộ nút.
  done_signal:
    type: copy_button
    scope: after
    use_copy_result: true
    fallback_quiet_ms: 0
    quiet_ms: 1000
    timeout_ms: 300000
flows:
  select_model:
    selector: '[aria-label="Select Model"]'
    action: 'click:[aria-label="Select Model"]'
    # alternative neo bền hơn: '#qwen-chat-header-left [aria-label="Select Model"]' hoặc 'div.wms-trigger'
  image:
    type: image
    action: 'click:[aria-label="Select Mode"];click:[role="menuitem"]:has-text("Create Image")'
    response:
      # Ảnh kết quả là img.qwen-image; gallery gợi ý dùng class khác nên không lẫn.
      media_selector: img.qwen-image
      done_signal:
        type: selector_appear
        selector: img.qwen-image
        timeout_ms: 300000
new_chat:
  selector: div[role='button'][aria-label='New Chat']
timing:
  ready_delay_ms: 2000
  input_delay_ms: 600
models:
  - id: qwen3.7-plus
    action: 'click:div[role="listbox"][aria-label="Models"] div[role="option"]:has-text("Qwen3.7-Plus")'
    capability: chat
  - id: qwen3.8-max
    action: 'click:div[role="listbox"][aria-label="Models"] div[role="option"]:has-text("Qwen3.8-Max")'
    capability: chat
  # Chế độ Create Image tự chọn Qwen-Image; không mở dropdown chat ở đó.
  - id: image
    capability: image
  # giữ alias cũ nếu client đang dùng qwen-web/qwen-web
  - id: qwen-web
    capability: chat
login:
  anon_trial_limit: 20
  strategy: round_robin
  quota: 50
keep_context: true
