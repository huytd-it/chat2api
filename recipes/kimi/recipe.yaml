slug: kimi
url: https://www.kimi.ai/
prompt:
  input_selector: '[data-lexical-editor="true"]'
  input_mode: fill
  submit: Enter
response:
  last_message_selector: div.chat-content-item-assistant
  format: markdown
  capture_html: true
  # Modal hết hạn / quá tải Kimi KHÔNG nằm trong reply mà là dialog riêng:
  # <div class="modal-container" data-testid="confirm-dialog"> "Too many people
  # are chatting with Kimi; a subscription will grant you priority access."
  # Quota miễn phí hết: <span>Your free quota is used up. Refreshes at 10-27.</span>
  # Dính pattern thì khóa tạm account này 24h rồi chuyển account khác cùng
  # recipe (mỗi account 1 lần). Hết account → 429, không trả msg cảnh báo cho client.
  limit_patterns:
    - "Too many people are chatting with Kimi"
    - "subscription will grant you priority access"
    - "Your free quota is used up"
  limit_cooldown_hours: 24
  done_signal:
    type: copy_button
    selector: .segment-assistant-actions-content .icon-button:first-child
    scope: inside
    use_copy_result: true
    quiet_ms: 800
    fallback_quiet_ms: 15000
    timeout_ms: 120000
timing:
  ready_delay_ms: 1500
  input_delay_ms: 500
models:
- id: default
login:
  strategy: round_robin
  quota: 50
keep_context: true
