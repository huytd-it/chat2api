slug: deepseek-web
url: https://chat.deepseek.com/
prompt:
  input_selector: 'textarea[name="search"]'
  input_mode: fill
  submit: Enter
response:
  last_message_selector: 'div[data-virtual-list-item-key]'
  done_signal:
    type: copy_button
    # Thanh hành động mỗi reply có NHIỀU nút cùng class ds-button--icon
    # (copy / like / dislike / share / retry...), copy là nút ĐẦU TIÊN
    # bên trái. Selector cũ khớp hết nên engine bấm usable[last] trúng nút
    # share cuối cùng. Neo :first-of-type để mỗi toolbar chỉ còn nút copy.
    selector: 'div[data-virtual-list-item-key] div[role="button"].ds-button--icon:first-of-type'
    scope: after
    use_copy_result: true
    quiet_ms: 600
    fallback_quiet_ms: 15000
    timeout_ms: 120000
models:
  - id: default
login:
  strategy: round_robin
  quota: 50
keep_context: true
new_chat:
  selector: 'div._5a8ac7a'
