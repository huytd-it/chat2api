slug: chatgpt-web
url: https://chatgpt.com/
prompt:
  # Composer là ProseMirror; aria-label đổi theo project ("New chat in ...")
  # nên neo vào contenteditable thay vì câu chữ cố định.
  input_selector: div[contenteditable="true"][role="textbox"]
  input_mode: fill
  submit: click:button[aria-label="Send"]
response:
  last_message_selector: div[data-turn-key] [data-markdown-text-style="assistant-message"]
  done_signal:
    # Chỉ sao chép khi nút Copy của reply cuối đã hiện, không đoán theo Stop.
    type: copy_button
    scope: after
    use_copy_result: true
    fallback_quiet_ms: 0
    quiet_ms: 1000
    timeout_ms: 120000
flows:
  image:
    type: image
    # Trang tạo ảnh có composer riêng; vào bằng nút Images trong sidebar.
    action: 'click:nav[aria-label="Chat history"] button:has-text("Images")'
    response:
      media_selector: img[alt^="Generated image"]
      done_signal:
        type: selector_appear
        selector: img[alt^="Generated image"]
        timeout_ms: 300000
models:
- id: default
- id: image
  capability: image
login:
  strategy: round_robin
  quota: 50
new_chat:
  selector: '#app-shell-sidebar > div:nth-of-type(2) > div > div > div > nav > div
    > div > div > button'
keep_context: true
