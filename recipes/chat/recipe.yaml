url: https://chat.qwen.ai/
prompt:
  input_selector: textarea[placeholder="Ask Qwen"]
  input_mode: type
  submit: Enter
response:
  last_message_selector: .qwen-markdown, .markdown-body
  done_signal:
    type: stable_text
    quiet_ms: 3000
    timeout_ms: 120000
models:
- id: qwen-web
slug: chat
