url: https://chat.qwen.ai/
prompt:
  input_selector: textarea[placeholder='Ask Qwen']
  input_mode: fill
  submit: Enter
response:
  last_message_selector: .qwen-markdown
  done_signal:
    type: stable_text
    quiet_ms: 3000
    timeout_ms: 120000
new_chat:
  selector: div[role='button'][aria-label='New Chat']
timing:
  ready_delay_ms: 2000
  input_delay_ms: 600
models:
- id: qwen-web
slug: chat
login:
  anon_trial_limit: 20
